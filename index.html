<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RE:BORN Margin Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main>
    <div class="panel">

      <label class="field">
        <div class="field-title">원가</div>
        <div class="field-row">
          <input id="unitCost" type="number" value="0">
          <button class="save-btn" data-target="unitCost">저장</button>
        </div>
      </label>

      <label class="field">
        <div class="field-title">수량</div>
        <div class="field-row">
          <input id="quantity" type="number" value="0">
          <button class="save-btn" data-target="quantity">저장</button>
        </div>
      </label>

      <label class="field">
        <div class="field-title">판매가</div>
        <div class="field-row">
          <input id="salePrice" type="number" value="0">
          <button class="save-btn" data-target="salePrice">저장</button>
        </div>
      </label>

      <!-- 🔥 박스비 추가 -->
      <label class="field">
        <div class="field-title">박스비</div>
        <div class="field-row">
          <input id="boxFee" value="대" readonly>

          <div class="box-btn-group">
            <button data-size="대">대</button>
            <button data-size="중">중</button>
            <button data-size="소">소</button>
          </div>

          <button class="save-btn" data-target="boxFee">저장</button>
        </div>
      </label>

      <label class="field">
        <div class="field-title">택배비</div>
        <div class="field-row">
          <input id="shippingFee" type="number" value="2400">
          <button class="save-btn" data-target="shippingFee">저장</button>
        </div>
      </label>

      <label class="field">
        <div class="field-title">수수료</div>
        <div class="field-row">
          <input id="coupangFeeRate" type="number" value="12">
          <button class="save-btn" data-target="coupangFeeRate">저장</button>
        </div>
      </label>

      <label class="field">
        <div class="field-title">부가세</div>
        <div class="field-row">
          <input id="vatRate" type="number" value="0">
          <button class="save-btn" data-target="vatRate">저장</button>
        </div>
      </label>

      <label class="field">
        <div class="field-title">선정산</div>
        <div class="field-row">
          <input id="earlySettlementRate" type="number" value="1.2">
          <button class="save-btn" data-target="earlySettlementRate">저장</button>
        </div>
      </label>

      <hr>

      <div>총비용: <span id="totalCost">0</span></div>
      <div>순이익: <span id="profit">0</span></div>
      <div>마진율: <span id="marginRate">0%</span></div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
